<head>

<title>Resolve de bolsillo</title>

<style>
:root{--bg:#17181c;--panel:#202228;--line:#353944;--fg:#e9eaee;--muted:#9ea3b0;--accent:#ff8a3d;--ink:#1a1206;--bad:#ff7a6b;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f3f3f1;--panel:#fff;--line:#d3d4d0;--fg:#1b1c20;--muted:#5d616b;--accent:#c9530a;--ink:#fff;--bad:#c62828;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
h1{margin:0;font:800 1.9rem/1.1 "Bricolage Grotesque","Arial Narrow",system-ui,sans-serif}
h1 i{font-style:normal;color:var(--accent)}
p{margin:0;color:var(--muted)}
label{font-size:.9rem;color:var(--muted)}
input[type=password]{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--ink);font:600 1rem inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);min-height:1.4em;font-size:.92rem}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <label class="row"><input id="rem" type="checkbox"> Recordar en este dispositivo</label>
  <button id="go" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
</form>
